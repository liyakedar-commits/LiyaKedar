<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="/support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
@font-face { font-family: 'Poppins'; src: url("/assets/skater/Poppins-Regular.ttf") format("truetype"); font-weight: 400 700; font-display: block; }
body { margin: 0; }
a { color: inherit; text-decoration: none; }
.sk-in::placeholder { color: #9A9FAE; }
.sk-scroll { scrollbar-width: none; -ms-overflow-style: none; }
.sk-scroll::-webkit-scrollbar { width: 0; height: 0; display: none; }
</style>
</helmet>
<div style="container-type:inline-size;width:100%;height:100%;overflow:hidden;position:relative;background:#FFFFFF">
  <div class="sk-scroll" style="position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;background:#FFFFFF">
    <div style="padding:7cqw 4.6cqw 0;display:flex;flex-direction:column;align-items:center">
      <div style="width:32cqw;aspect-ratio:1 / 1;border-radius:50%;overflow:hidden;flex:none">
        <video src="/assets/skater/hero.mp4" autoPlay="{{ true }}" loop="{{ true }}" muted="{{ true }}" playsInline="{{ true }}" style="width:100%;height:100%;object-fit:cover;display:block"></video>
      </div>
      <div style="font-family:'Poppins',sans-serif;font-weight:700;color:{{ accent }};font-size:6.4cqw;line-height:1.2;text-align:center;letter-spacing:0.02em;text-transform:uppercase;margin-top:4cqw">Michael Jake</div>
      <div style="font-family:'Poppins',sans-serif;font-weight:400;color:{{ accent }};font-size:4cqw;line-height:1.3;text-align:center;margin-top:0.6cqw">Content Creator</div>
      <div style="display:flex;align-items:center;gap:5.6cqw;margin-top:4cqw">
        <a href="#" style="display:flex;align-items:center;justify-content:center;flex:none">
          <svg viewBox="0 0 24 24" style="width:8cqw;height:8cqw;display:block"><rect x="2.6" y="2.6" width="18.8" height="18.8" rx="5.4" fill="none" stroke="{{ accent }}" stroke-width="2.1"></rect><circle cx="12" cy="12" r="4.3" fill="none" stroke="{{ accent }}" stroke-width="2.1"></circle><circle cx="17.6" cy="6.5" r="1.35" fill="{{ accent }}"></circle></svg>
        </a>
        <a href="#" style="display:flex;align-items:center;justify-content:center;flex:none">
          <svg viewBox="0 0 24 24" style="width:8cqw;height:8cqw;display:block"><path d="M16.6 5.82A4.28 4.28 0 0 1 15.54 3h-3.09v12.4a2.59 2.59 0 1 1-1.84-2.48V9.77a5.68 5.68 0 1 0 4.93 5.63V8.87a7.35 7.35 0 0 0 4.3 1.38V7.16a4.29 4.29 0 0 1-3.24-1.34z" fill="{{ accent }}"></path></svg>
        </a>
        <a href="#" style="display:flex;align-items:center;justify-content:center;flex:none">
          <svg viewBox="0 0 24 24" style="width:8.8cqw;height:8.8cqw;display:block"><rect x="2" y="5.4" width="20" height="13.2" rx="3.6" fill="{{ accent }}"></rect><path d="M10.2 9.1v5.8l5-2.9z" fill="#FFFFFF"></path></svg>
        </a>
      </div>
      <a href="#" style="margin-top:5cqw;width:100%;box-sizing:border-box;text-align:center;padding:3.6cqw;border-radius:10cqw;border:0.35cqw solid {{ accent }};font-family:'Poppins',sans-serif;font-weight:700;color:{{ accent }};font-size:3.9cqw">Skate Log</a>
    </div>
    <div style="height:1px;background:{{ divider }};margin:7cqw 0 0"></div>
    <div style="padding:6cqw 4.6cqw 0">
      <div style="font-family:'Poppins',sans-serif;font-weight:700;color:{{ accent }};font-size:4.4cqw;text-align:center">My Gear</div>
      <img src="/assets/skater/hat.avif" alt="The Core Navy Hat" style="width:100%;height:auto;display:block;margin-top:3.4cqw;border-radius:2.8cqw" />
      <div style="font-family:'Poppins',sans-serif;font-weight:700;color:{{ accent }};font-size:4.4cqw;margin-top:3.6cqw">The Core Navy Hat</div>
      <div style="font-family:'Poppins',sans-serif;font-weight:400;color:{{ accent }};font-size:3.6cqw;line-height:1.4;margin-top:1cqw">Made for everyday wear, on or off the board.</div>
      <div style="font-family:'Poppins',sans-serif;font-weight:700;color:{{ accent }};font-size:5.4cqw;margin-top:2.4cqw">$29.99</div>
      <div style="margin-top:3.4cqw;background:{{ accent }};color:#FFFFFF;font-family:'Poppins',sans-serif;font-weight:700;font-size:4cqw;text-align:center;padding:3.6cqw;border-radius:10cqw;cursor:pointer">Buy now</div>
    </div>
    <div style="height:1px;background:{{ divider }};margin:7cqw 0 0"></div>
    <div style="padding:6cqw 4.6cqw 8cqw">
      <div style="border:1px solid {{ divider }};border-radius:3.4cqw;overflow:hidden">
        <div style="font-family:'Poppins',sans-serif;font-weight:700;color:{{ accent }};font-size:4.4cqw;text-align:center;padding:4.6cqw 4cqw;border-bottom:1px solid {{ divider }}">Get Updates</div>
        <div style="padding:4.6cqw;display:flex;flex-direction:column;gap:3cqw">
          <input class="sk-in" type="text" placeholder="Name" style="width:100%;box-sizing:border-box;background:{{ inputBg }};border:none;border-radius:2cqw;padding:3.4cqw;font-family:'Poppins',sans-serif;font-size:3.6cqw;color:{{ accent }};outline:none" />
          <input class="sk-in" type="email" placeholder="Email" style="width:100%;box-sizing:border-box;background:{{ inputBg }};border:none;border-radius:2cqw;padding:3.4cqw;font-family:'Poppins',sans-serif;font-size:3.6cqw;color:{{ accent }};outline:none" />
          <input class="sk-in" type="tel" placeholder="Phone" style="width:100%;box-sizing:border-box;background:{{ inputBg }};border:none;border-radius:2cqw;padding:3.4cqw;font-family:'Poppins',sans-serif;font-size:3.6cqw;color:{{ accent }};outline:none" />
          <div style="font-family:'Poppins',sans-serif;color:{{ accent }};font-size:3.2cqw;line-height:1.45">By submitting your contact details, you are providing your data to Michael, who may contact you for marketing purposes.</div>
          <div onClick="{{ submit }}" style="background:{{ accent }};color:#FFFFFF;font-family:'Poppins',sans-serif;font-weight:700;font-size:4cqw;text-align:center;padding:3.6cqw;border-radius:10cqw;cursor:pointer">{{ submitLabel }}</div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:390,&quot;height&quot;:760}}">
class Component extends DCLogic {
  state = { sent: false };
  renderVals() {
    return {
      accent: '#1C2B4A',
      divider: 'rgba(28,43,74,0.14)',
      inputBg: '#F0F0F0',
      submitLabel: this.state.sent ? 'Thanks!' : 'Submit',
      submit: () => {
        this.setState({ sent: true });
        setTimeout(() => this.setState({ sent: false }), 1800);
      }
    };
  }
}
</script>
</body>
</html>
